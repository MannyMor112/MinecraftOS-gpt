set default=0
set timeout=8
terminal_output console

menuentry 'Minecraft 1.8.9 (live)' {
    linux /live/vmlinuz boot=live components quiet loglevel=3 systemd.show_status=auto
    initrd /live/initrd.img
}
menuentry 'Minecraft 1.8.9 benchmark (live)' {
    linux /live/vmlinuz boot=live components quiet loglevel=3 systemd.show_status=auto brick.mode=benchmark
    initrd /live/initrd.img
}
menuentry 'Install to internal eMMC (erases Lubuntu)' {
    linux /live/vmlinuz boot=live components quiet loglevel=3 systemd.show_status=auto brick.mode=install
    initrd /live/initrd.img
}
